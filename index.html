<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Moriartyhung</title>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <style>
    :root { color-scheme: light dark; }
    body{
      font-family: system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,"Noto Sans TC",sans-serif;
      max-width: 820px; margin: 40px auto; padding: 0 16px; line-height: 1.7;
    }
    h1{ font-size: 42px; margin-bottom: 12px; }
    code{ padding: 2px 6px; border-radius: 6px; background: #f2f2f2; }
    button{
      padding: 10px 16px; border: 1px solid #cfcfcf; border-radius: 10px; cursor: pointer;
      background: #f8f8f8;
    }
    #box, #todoBox, #localBox{
      padding: 14px; border: 1px solid #e5e5e5; border-radius: 10px; background: #fafafa;
      white-space: pre-wrap;
      overflow: auto;
    }
    hr{ margin: 28px 0; }
  </style>
</head>
<body>
  <h1>我的 GitHub 個人頁</h1>
  <p>這頁面部署在 <code>Moriartyhung.github.io</code>。下面先放一個最基本的 jQuery 功能。</p>

  <div id="box">還沒點按鈕。</div>
  <p><button id="btn">用 jQuery 改內容</button></p>

  <hr>
  <h2>AJAX / JSON 測試</h2>
  <p>點按鈕後，會用 jQuery 從公開 API 取得一筆 JSON（JSONPlaceholder）。</p>
  <p><button id="loadTodo">載入 Todo</button></p>
  <pre id="todoBox">尚未載入</pre>

  <h3>載入本地 data.json</h3>
  <p><button id="loadLocal">載入本地 JSON</button></p>
  <pre id="localBox">尚未載入</pre>

  <script>
    // jQuery 互動：點一下就改文字
    $("#btn").on("click", function () {
      $("#box").text("jQuery 作用中，作業可驗收。");
    });

    // AJAX：取得外部 JSON 並顯示
    $("#loadTodo").on("click", function () {
      $("#todoBox").text("載入中...");
      $.getJSON("https://jsonplaceholder.typicode.com/todos/1")
        .done(function (data) {
          $("#todoBox").text(JSON.stringify(data, null, 2));
        })
        .fail(function () {
          $("#todoBox").text("載入失敗。");
        });
    });

    // AJAX：從倉庫中的 data.json 載入並顯示
    $("#loadLocal").on("click", function () {
      $("#localBox").text("載入中...");
      $.getJSON("./data.json")
        .done(function (data) {
          $("#localBox").text(JSON.stringify(data, null, 2));
        })
        .fail(function () {
          $("#localBox").text("載入失敗。");
        });
    });
  </script>
</body>
</html>
