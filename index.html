<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Moriartyhung · Elden Ring · 大劍</title>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <style>
    :root { color-scheme: light dark; }
    body{
      font-family: system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,"Noto Sans TC",sans-serif;
      max-width: 980px; margin: 40px auto; padding: 0 16px; line-height: 1.7;
      background: #ffffff; color: #111111;
    }
    h1{ font-size: 42px; margin-bottom: 12px; }
    h2{ margin-top: 28px; }
    code{ padding: 2px 6px; border-radius: 6px; background: #f2f2f2; color:#111; }
    button{
      padding: 10px 16px; border: 1px solid #cfcfcf; border-radius: 10px; cursor: pointer;
      background: #f8f8f8; color:#111; font-weight: 600;
    }
    #box,#todoBox,#localBox{
      padding: 14px; border: 1px solid #e5e5e5; border-radius: 10px; background: #fafafa;
      white-space: pre-wrap; overflow: auto; color:#111;
    }
    hr{ margin: 28px 0; }

    /* 封面與畫廊 */
    .cover{width:100%; border-radius:14px; display:block; margin:10px 0 18px;}
    .gal-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px;}
    .gal-grid img{width:100%; border-radius:12px; cursor:pointer;}

    /* Lightbox */
    .overlay{
      position:fixed; inset:0; display:none; /* JS 會切到 flex */
      align-items:center; justify-content:center;
      background:rgba(0,0,0,.78); z-index:9999; padding:20px;
    }
    .overlay .inner{position:relative; max-width:92vw; max-height:92vh; text-align:center;}
    .overlay img{max-width:92vw; max-height:80vh; border-radius:12px; display:block; margin:0 auto;}
    .overlay p{color:#fff; margin-top:10px; opacity:.9}
    .navbtn,.closebtn{
      position:absolute; top:50%; transform:translateY(-50%);
      background:rgba(0,0,0,.5); color:#fff; border:1px solid #666;
      border-radius:999px; width:44px; height:44px; display:flex; align-items:center; justify-content:center;
      cursor:pointer; user-select:none;
    }
    #prevBtn{left:-56px;}
    #nextBtn{right:-56px;}
    .closebtn{top:-14px; right:-14px; transform:none; width:36px; height:36px;}

    /* 武器區 */
    .toolbar{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:8px 0 14px;}
    .inp,.sel{padding:10px 12px; border:1px solid #cfcfcf; border-radius:10px; background:#fff;}
    #wpnCat{ display:none; }  /* 只做一類，選單藏起來 */
    .weapon-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:12px;}
    .weapon-card{border:1px solid #ddd; border-radius:14px; padding:12px; background:#fafafa; display:flex; gap:12px; align-items:flex-start;}
    .weapon-card img{
      width:90px; height:90px; object-fit:cover; border-radius:10px; flex:0 0 90px;
      cursor: zoom-in; /* NEW: 顯示可放大 */
    }
    .weapon-card h4{margin:0 0 6px 0; font-size:18px;}
    .weapon-card .meta{font-size:13px; opacity:.85}
    .pick{display:flex; align-items:center; gap:6px; margin-top:6px; font-size:13px;}
    .compare{margin-top:16px; border:1px solid #ddd; border-radius:14px; padding:12px; background:#fafafa;}
    .cmp-table{width:100%; border-collapse:collapse; font-size:14px;}
    .cmp-table th,.cmp-table td{border-top:1px solid #e5e5e5; padding:8px 6px; text-align:left;}
    .muted{opacity:.7}

    @media (prefers-color-scheme: dark){
      body{ background:#0f0f10; color:#eaeaea; }
      code{ background:#2a2a2b; color:#eee; }
      button{ background:#1f1f20; color:#fff; border-color:#3a3a3b; }
      #box,#todoBox,#localBox,.weapon-card,.compare{ background:#161617; border-color:#2d2d2e; color:#eaeaea; }
      .inp,.sel{ background:#0f0f10; color:#eaeaea; border-color:#2d2d2e; }
    }
  </style>
</head>
<body>
  <!-- 封面 -->
  <img src="images/cover.jpg" alt="ELDEN RING 封面" class="cover">

  <!-- 畫廊 -->
  <section id="gallery">
    <h2>拉塔恩畫廊</h2>
    <div id="galGrid" class="gal-grid"></div>
  </section>

  <!-- 放大檢視 -->
  <div id="galOverlay" class="overlay">
    <div class="inner">
      <div id="prevBtn" class="navbtn" aria-label="上一張">‹</div>
      <div id="nextBtn" class="navbtn" aria-label="下一張">›</div>
      <div id="closeBtn" class="closebtn" aria-label="關閉">✕</div>
      <img id="galBig" alt="">
      <p id="galCap"></p>
    </div>
  </div>

  <hr>

  <!-- 大劍 -->
  <section id="weapons">
    <h2>大劍</h2>
    <div class="toolbar">
      <select id="wpnCat" class="sel" aria-label="武器分類"></select>
      <input id="wpnSearch" class="inp" type="search" placeholder="搜尋名稱/評價">
    </div>
    <div id="wpnGrid" class="weapon-grid"></div>
    <div id="wpnCompare" class="compare" style="display:none;">
      <h3 style="margin:0 0 8px 0;">比較</h3>
      <table class="cmp-table" id="cmpTable"></table>
      <p class="muted" style="margin-top:6px;">提示：勾選卡片上的「加入比較」，最多兩把。</p>
    </div>
  </section>

  <hr>

  <!-- 原本作業區保留 -->
  <h1>我的 GitHub 個人頁</h1>
  <p>這頁面部署在 <code>Moriartyhung.github.io</code>。下面先放一個最基本的 jQuery 功能。</p>

  <div id="box">還沒點按鈕。</div>
  <p><button id="btn">用 jQuery 改內容</button></p>

  <hr>
  <h2>AJAX / JSON 測試</h2>
  <p>點按鈕後，會用 jQuery 從公開 API 取得一筆 JSON（JSONPlaceholder）。</p>
  <p><button id="loadTodo">載入 Todo</button></p>
  <pre id="todoBox">尚未載入</pre>

  <h3>載入本地 data.json</h3>
  <p><button id="loadLocal">載入本地 JSON</button></p>
  <pre id="localBox">尚未載入</pre>

  <script>
    /* ===== 畫廊：載入清單並渲染縮圖 ===== */
    let GALLERY = [], CUR_INDEX = -1;

    $.getJSON("./gallery.json").done(function(list){
      GALLERY = list;
      const $g = $("#galGrid");
      list.forEach((item, idx)=>{
        const $img = $(
          `<img loading="lazy" src="${item.thumb}" alt="${item.title}"
                data-idx="${idx}" data-full="${item.full}" data-cap="${item.caption}">`
        );
        $g.append($img);
      });
    }).fail(function(){
      $("#galGrid").html("載入 gallery.json 失敗，請檢查路徑。");
    });

    // NEW: 通用開啟 overlay（withNav: 是否顯示左右鍵）
    function openOverlay(src, caption, withNav=true){
      $("#galBig").attr("src", "");
      $("#galCap").text("");
      $("#galOverlay").css("display","flex").hide().fadeIn(60);
      $("#prevBtn, #nextBtn").css("display", withNav ? "" : "none");
      const img = new Image();
      img.onload = ()=>{ $("#galBig").attr("src", src); $("#galCap").text(caption||""); };
      img.onerror = ()=>{ $("#galBig").attr("src", src); $("#galCap").text((caption?caption+" · ":"")+"載入失敗"); };
      img.src = src;
    }

    function showImage(i){
      if(!GALLERY.length) return;
      CUR_INDEX = (i + GALLERY.length) % GALLERY.length;
      const item = GALLERY[CUR_INDEX];
      const cap  = item.caption || "";
      openOverlay(item.full, cap, true);             // NEW: 用通用函式
      const n = new Image(); n.src = GALLERY[(CUR_INDEX+1)%GALLERY.length].full; // 預載下一張
    }

    $(document).on("click","#galGrid img",function(){ showImage(Number($(this).data("idx"))); });
    $("#prevBtn").on("click", ()=> showImage(CUR_INDEX-1));
    $("#nextBtn").on("click", ()=> showImage(CUR_INDEX+1));
    $("#closeBtn").on("click", ()=> $("#galOverlay").fadeOut(120));
    $("#galOverlay").on("click", e=>{ if(e.target===e.currentTarget) $("#galOverlay").fadeOut(120); });
    $(document).on("keydown", e=>{
      if(!$("#galOverlay").is(":visible")) return;
      if(e.key==="Escape") $("#galOverlay").fadeOut(120);
      if(e.key==="ArrowLeft")  $("#prevBtn").is(":visible") && showImage(CUR_INDEX-1);
      if(e.key==="ArrowRight") $("#nextBtn").is(":visible") && showImage(CUR_INDEX+1);
    });

    /* ===== 武器：分類/搜尋/渲染/比較 ===== */
    let WPN_INDEX = [], WPN_LIST = [], CMP_IDS = [];

    $.getJSON("./weapons/index.json").done(function(cats){
      WPN_INDEX = cats;
      const $sel = $("#wpnCat").empty();
      cats.forEach(c => $sel.append(`<option value="${c.id}">${c.name}</option>`));
      if (cats.length) loadCategory(cats[0].id);
    }).fail(function(){
      $("#wpnGrid").html("載入 weapons/index.json 失敗。");
    });

    $("#wpnCat").on("change", function(){ loadCategory(this.value); });

    function loadCategory(catId){
      $("#wpnGrid").html("載入中...");
      CMP_IDS = [];
      $("#wpnCompare").hide();
      $.getJSON(`./weapons/${catId}.json`).done(function(list){
        WPN_LIST = list;
        renderWeapons();
      }).fail(function(){
        $("#wpnGrid").html("載入分類資料失敗。");
      });
    }

    function getArcane(obj){ return obj ? (obj["秘法"] ?? obj["感應"] ?? 0) : 0; }
    function getArcScale(obj){ return obj ? (obj["秘法"] ?? obj["感應"] ?? "—") : "—"; }

    $("#wpnSearch").on("input", renderWeapons);

    function renderWeapons(){
      const q = $("#wpnSearch").val()?.trim();
      const list = !q ? WPN_LIST : WPN_LIST.filter(w =>
        (w.name||"").includes(q) || (w["評價"]||w["備註"]||"").includes(q)
      );

      const $g = $("#wpnGrid").empty();
      if(!list.length){ $g.html("沒有符合的武器。"); return; }

      list.forEach(w=>{
        const req = w["能力需求"]||{};
        const sca = w["補正"]||{};
        const arcReq = getArcane(req), arcSca = getArcScale(sca);

        const card = $(`
          <div class="weapon-card" data-id="${w.id}">
            <img loading="lazy" src="${w.image}" alt="${w.name||w.id}">
            <div class="info">
              <h4>${w.name||w.id}</h4>
              <div class="meta">
                重量：${w["重量"] ?? 0}｜
                力${req["力量"]??0} 敏${req["敏捷"]??0} 智${req["智力"]??0} 信${req["信仰"]??0} 感/秘${arcReq}
                <br>
                補正：力${sca["力量"]||"—"} 敏${sca["敏捷"]||"—"} 智${sca["智力"]||"—"} 信${sca["信仰"]||"—"} 感/秘${arcSca}
                ${w["戰技"] ? ("｜戰技："+w["戰技"]) : ""}
              </div>
              ${w["評價"] ? `<div class="meta">${w["評價"]}</div>` : (w["備註"] ? `<div class="meta">${w["備註"]}</div>` : "")}
              <label class="pick"><input type="checkbox" class="cmpChk"> 加入比較</label>
            </div>
          </div>
        `);
        $g.append(card);
      });
    }

    // NEW: 點「武器圖片」開浮層（單張，不顯示左右切換）
    $(document).on("click", ".weapon-card img", function(){
      const src  = $(this).attr("src");
      const name = $(this).closest(".weapon-card").find("h4").text();
      CUR_INDEX = -1;                  // 表示不是畫廊，不用左右切
      openOverlay(src, name, false);   // withNav=false 隱藏左右鍵
    });

    $(document).on("change",".cmpChk", function(){
      const id = $(this).closest(".weapon-card").data("id");
      if(this.checked){
        if(CMP_IDS.length >= 2){
          this.checked = false;
          alert("一次最多比較兩把。");
          return;
        }
        CMP_IDS.push(id);
      }else{
        CMP_IDS = CMP_IDS.filter(x => x!==id);
      }
      renderCompare();
    });

    function renderCompare(){
      if(CMP_IDS.length < 2){ $("#wpnCompare").hide(); $("#cmpTable").empty(); return; }
      const [aId,bId] = CMP_IDS;
      const a = WPN_LIST.find(x=>x.id===aId);
      const b = WPN_LIST.find(x=>x.id===bId);
      if(!a || !b) return;

      const aReq=a["能力需求"]||{}, bReq=b["能力需求"]||{};
      const aSca=a["補正"]||{}, bSca=b["補正"]||{};
      const aArcReq=getArcane(aReq), bArcReq=getArcane(bReq);
      const aArcSca=getArcScale(aSca), bArcSca=getArcScale(bSca);
      const aSta=a["異常"]||{}, bSta=b["異常"]||{};

      const rows = [
        ["名稱", a.name||a.id, b.name||b.id],
        ["重量", a["重量"]??0, b["重量"]??0],
        ["能力需求",
          `力${aReq["力量"]??0} 敏${aReq["敏捷"]??0} 智${aReq["智力"]??0} 信${aReq["信仰"]??0} 感/秘${aArcReq}`,
          `力${bReq["力量"]??0} 敏${bReq["敏捷"]??0} 智${bReq["智力"]??0} 信${bReq["信仰"]??0} 感/秘${bArcReq}`],
        ["補正",
          `力${aSca["力量"]||"—"} 敏${aSca["敏捷"]||"—"} 智${aSca["智力"]||"—"} 信${aSca["信仰"]||"—"} 感/秘${aArcSca}`,
          `力${bSca["力量"]||"—"} 敏${bSca["敏捷"]||"—"} 智${bSca["智力"]||"—"} 信${bSca["信仰"]||"—"} 感/秘${bArcSca}`],
        ["戰技", a["戰技"]||"—", b["戰技"]||"—"],
        ["異常",
          `出血${aSta["出血"]??0} 凍傷${aSta["凍傷"]??0} 中毒${aSta["中毒"]??0} 腐敗${aSta["腐敗"]??0}`,
          `出血${bSta["出血"]??0} 凍傷${bSta["凍傷"]??0} 中毒${bSta["中毒"]??0} 腐敗${bSta["腐敗"]??0}`],
        ["評價", a["評價"]||a["備註"]||"—", b["評價"]||b["備註"]||"—"]
      ];

      const $t = $("#cmpTable").empty();
      $t.append(`<tr><th></th><th>${a.name||a.id}</th><th>${b.name||b.id}</th></tr>`);
      rows.forEach(r=> $t.append(`<tr><th>${r[0]}</th><td>${r[1]}</td><td>${r[2]}</td></tr>`));
      $("#wpnCompare").show();
    }

    /* ===== 原本的 jQuery / AJAX 區 ===== */
    $("#btn").on("click", function () {
      $("#box").text("jQuery 作用中，作業可驗收。");
    });

    $("#loadTodo").on("click", function () {
      $("#todoBox").text("載入中...");
      $.getJSON("https://jsonplaceholder.typicode.com/todos/1")
        .done(data => $("#todoBox").text(JSON.stringify(data, null, 2)))
        .fail(() => $("#todoBox").text("載入失敗。"));
    });

    $("#loadLocal").on("click", function () {
      $("#localBox").text("載入中...");
      $.getJSON("./data.json")
        .done(data => $("#localBox").text(JSON.stringify(data, null, 2)))
        .fail(() => $("#localBox").text("載入失敗。"));
    });
  </script>
</body>
</html>
