<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Moriartyhung</title>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;max-width:720px;margin:40px auto;padding:0 16px;line-height:1.6}
    button{padding:8px 14px;border:1px solid #ccc;border-radius:8px;cursor:pointer}
    #box{padding:12px;border:1px solid #eee;border-radius:8px;background:#fafafa}
  </style>
</head>
<body>
  <h1>我的 GitHub 個人頁</h1>
  <p>這頁面部署在 <code>Moriartyhung.github.io</code>。下面有一個最基本的 jQuery 功能。</p>

  <div id="box">還沒點按鈕。</div>
  <p><button id="btn">用 jQuery 改內容</button></p>

  <script>
    // 簡單的 jQuery 互動：點一下就改文字
    $("#btn").on("click", function () {
      $("#box").text("jQuery 作用中，作業可驗收。");
    });
  </script>
</body>
</html>
